---
layout: default
title: Tenant Resources
description: "Find community resources."
---

<header class="position-relative">
    <img src="img/tr-header.webp" class="hero-image" alt="">

    {% include main-nav.html %}

    <div class="position-absolute bottom-0 start-0 w-100">
        <div class="container p-4 rounded-top-4 tr-header">
            <h1>Tenant Resources by Service Planning Area (SPA)</h1>
            <p class="lead mb-0">
                Resources are organized by Service Planning Area (SPA)
                to help you find services available in your community.
            </p>
        </div>
    </div>
</header>
<main class="container my-5">
    <!-- Template used by JavaScript --><template id="spa-section-template">
        <section class="spa-section mt-5">
            <h2 data-field="spa-display-name"></h2>
            <section class="ms-5">
                <article class="mt-4">
                    <h4>ACOF buildings in this area</h4>
                    <ul data-field="buildings-list"></ul>
                </article>
                <article class="mt-4">
                    <h3>Resources available in this area</h3>
                    <table class="resources-table">
                        <thead>
                            <tr>
                                <th>Resource</th>
                                <th>Address</th>
                                <th>Phone</th>
                            </tr>
                        </thead>
                        <tbody data-field="resources-list"></tbody>
                    </table>
                </article>
            </section>
        </section>
    </template>
    <div id="spa-sections-container"></div>
</main>
<script src="js/tenant-resources.js" defer></script>
