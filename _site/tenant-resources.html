<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Find community resources.">
    <title>Tenant Resources</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">

    <style>
        body {
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        }

        /* Color scheme */
        :root {
            --deep-blue: #013556;
            --mist-blue: #E6EFF5;
            --ocean-blue: #01619C;
            --ice-blue: #E1F8FF;

            ECF6F9

            --soft-gray: rgb(244 244 244 / 80%) 
        }

        /* Color scheme classes */        
        .text-footer {
            color: var(--mist-blue);
        }
        .bg-footer {
            background-color: var(--deep-blue);
        }

        .tr-header {
            color: var(--ice-blue);
            background-color: var(--ocean-blue);
        }

        .hero-image {
            display: block;
            width: 100%;
            height: auto;
            min-height: 25rem;
            object-fit: cover;
        }

        .donate-section {
            background: url("img/donate-hands.webp") center / cover no-repeat;
        }

        .main-navbar {
            background-color: var(--soft-gray);
        }

        .resources-table tbody tr:hover {
            background-color: var(--mist-blue);
        }

        .resources-table {
            border-collapse: collapse;
            width: 100%;
        }

        .resources-table th,
        .resources-table td {
            border: 1px solid black;
            padding: 8px;
            text-align: left;
        }

        .resources-table th {
            font-weight: bold;
        }

        /* Apply pill-shaped corners when the navbar expands at the lg breakpoint. */
        @media (min-width: 992px) {
            .main-navbar {
                border-radius: 50rem;
            }
        }
    </style>
</head>

<body>
    <header class="position-relative">
    <img src="img/tr-header.webp" class="hero-image" alt="">

    <!-- Main navivgation -->
<nav class="navbar navbar-expand-lg z-3 mt-4 mx-lg-3 main-navbar position-absolute top-0 start-0 end-0"
    data-bs-theme="light" aria-label="Main navigation">
    <div class="container">
        <a class="navbar-brand" href="./">
            <img src="img/acof-logo.svg" alt="ACOF" height="46">
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainMenu"
            aria-controls="mainMenu" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainMenu">
            <ul class="navbar-nav ms-auto text-uppercase fw-medium">
                <li class="nav-item">
                    <a class="nav-link p-lg-3 text-black" href="./family-and-children.html">Family and Children</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link p-lg-3 text-black" href="./health-and-housing.html">Health & Housing</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link p-lg-3 text-black" href="./professional-development.html">Professional Development</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link p-lg-3 text-black" href="./tenant-resources.html">Tenant Resources</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

    <div class="position-absolute bottom-0 start-0 w-100">
        <div class="container p-4 rounded-top-4 tr-header">
            <h1>Tenant Resources by Service Planning Area (SPA)</h1>
            <p class="lead mb-0">
                Resources are organized by Service Planning Area (SPA)
                to help you find services available in your community.
            </p>
        </div>
    </div>
</header>
<main class="container my-5">
    <!-- Template used by JavaScript --><template id="spa-section-template">
        <section class="spa-section mt-5">
            <h2 data-field="spa-display-name"></h2>
            <section class="ms-5">
                <article class="mt-4">
                    <h4>ACOF buildings in this area</h4>
                    <ul data-field="buildings-list"></ul>
                </article>
                <article class="mt-4">
                    <h3>Resources available in this area</h3>
                    <table class="resources-table">
                        <thead>
                            <tr>
                                <th>Resource</th>
                                <th>Address</th>
                                <th>Phone</th>
                            </tr>
                        </thead>
                        <tbody data-field="resources-list"></tbody>
                    </table>
                </article>
            </section>
        </section>
    </template>
    <div id="spa-sections-container"></div>
</main>
<script src="js/tenant-resources.js" defer></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu"
        crossorigin="anonymous"></script>
</body>

</html>
