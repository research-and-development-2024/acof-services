<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.description | escape }}">
    <title>{{ page.title | escape }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">

    <style>
        body {
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        }

        /* Color scheme */
        :root {
            --deep-blue: #013556;
            --mist-blue: #E6EFF5;
            --ocean-blue: #01619C;
            --ice-blue: #E1F8FF;
            --cloud-blue: #ECF6F9;
            --lagoon-blue: #3D98B2;
            --pearl-gray: #F6F6F6;

            --soft-gray: rgb(244 244 244 / 80%) 
        }

        /* Color scheme classes */        
        .text-footer {
            color: var(--mist-blue);
        }
        .bg-footer {
            background-color: var(--deep-blue);
        }

        .tr-header {
            color: var(--ice-blue);
            background-color: var(--ocean-blue);
        }

        .tr-heading {
            color: var(--ocean-blue);        
        }

        .tr-subheading {
            color: var(--lagoon-blue);
        }

        .hero-image {
            display: block;
            width: 100%;
            height: auto;
            min-height: 25rem;
            object-fit: cover;
        }

        .donate-section {
            background: url("img/donate-hands.webp") center / cover no-repeat;
        }

        .main-navbar {
            background-color: var(--soft-gray);
        }

        .resources-table {
            border-collapse: collapse;
            width: 100%;
        }

        .resources-table th,
        .resources-table td {
            border: 1px solid var(--mist-blue);            
            text-align: left;            
        }

        .resources-table th {
            padding: 0.625rem 1.25rem;
            font-weight: bold;
            background-color: var(--pearl-gray);
        }

        .resources-table td {
            padding: 1.25rem;
            background-color: white;
        }

        .resources-table tbody tr:hover td {
            background-color: var(--mist-blue);
        }        

        /* Apply pill-shaped corners when the navbar expands at the lg breakpoint. */
        @media (min-width: 992px) {
            .main-navbar {
                border-radius: 50rem;
            }
        }
    </style>
</head>

<body>
    {{ content }}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu"
        crossorigin="anonymous"></script>
</body>

</html>
