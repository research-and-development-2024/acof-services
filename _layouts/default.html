<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.description | escape }}">
    <title>{{ page.title | escape }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">

    <style>
        /* Font & color scheme */
        :root {
            /* Dark to light blues */
            --deep-blue: #013556;
            --ocean-blue: #01619C;
            --harbor-blue: #3481B0;
            --lagoon-blue: #3D98B2;

            /* Pale blues */
            --mist-blue: #E6EFF5;
            --cloud-blue: #ECF6F9;
            --ice-blue: #E1F8FF;

            /* Grays */
            --slate-gray: #525252;
            --pearl-gray: #F6F6F6;
            --soft-gray: rgb(244 244 244 / 80%);
        }
        .donate-btn {
            /* color: var(--harbor-blue); */
            color: 
            background-color: var(--mist-blue);             
        }

        body {
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            color: var(--slate-gray);
        }

        .header-text-on-dark {
            color: var(--ice-blue);
        }

        .text-on-dark {
            color: var(--mist-blue);
        }

        /* Hero, header & images */
        .hero-image {
            display: block;
            width: 100%;
            height: auto;
            min-height: 25rem;
            object-fit: cover;
        }
        .hero-tagline {
            font-size: clamp(2rem, 5vw, 6rem);
        }
        #pd-readiness {
            background:
                linear-gradient(rgb(0 0 0 / 30%), rgb(0 0 0 / 50%)),
                url("img/pd-readiness.png") center / cover no-repeat;
            min-height: 25rem;
        }

        /* Main navigation menu */
        #main-navbar {
            background-color: var(--soft-gray);
        }

        #main-navbar .nav-link.active {
            text-decoration: underline;
            text-underline-offset: 0.3em;
        }

        /* Apply pill-shaped corners and bigger donate btn when the navbar expands at the lg breakpoint. */
        @media (min-width: 992px) {
            #main-navbar {
                border-radius: 50rem;
            }
            .donate-btn {
                font-size: 1.5rem;
                padding: 0.75rem 2rem;
            }            
        }

        /* Footer section */
        #footer {
            color: var(--mist-blue);
            background-color: var(--deep-blue);
        }

        /* Donate section */
        #donate {
            background: url("img/donate-hands.webp") center / cover no-repeat;
        }
    </style>
    {% if page.stylesheet %}
    <link rel="stylesheet" href="{{ page.stylesheet | relative_url }}">
    {% endif %}
</head>

<body>
    {{ content }}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu"
        crossorigin="anonymous"></script>
</body>

</html>
